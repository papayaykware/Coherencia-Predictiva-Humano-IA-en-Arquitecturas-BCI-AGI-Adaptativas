version: '3.9'

services:

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --reload

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cpea
      POSTGRES_PASSWORD: cpea
      POSTGRES_DB: cpea_db
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
