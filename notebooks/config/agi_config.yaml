# config/agi_config.yaml
agi:
  provider: "ollama"  # opciones: ollama, openai
  model: "llama3"     # para ollama: llama3, mistral, etc. Para openai: gpt-3.5-turbo, gpt-4
  
  # Parámetros de generación
  temperature: 0.7
  max_tokens: 150
  top_p: 0.9
  
  # Proveedores específicos
  ollama:
    base_url: "http://localhost:11434"
  
  openai:
    api_key: ${OPENAI_API_KEY}  # Se leerá de variable de entorno
  
  # Configuración del prompt
  prompt_template: |
    Basado en las siguientes características de EEG provenientes de un experimento de BCI:
    
    - Atención: {attention}
    - Relax: {relaxation}
    - Intención detectada: {intent}
    - Features vector: {features_summary}
    
    Por favor, responde de forma breve y adaptativa (máx. 2 frases) describiendo tu estado actual como AGI.
  
  # Si se desea usar features reales, se expandirá el template con los valores
